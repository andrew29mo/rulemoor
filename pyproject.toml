[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rulemoor"
version = "0.1.0"
description = "Confirmed Linux firewall changes with explicit recovery"
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
rulemoor = "rulemoor.cli:main"
rulemoor-agent = "rulemoor.service:main"

[tool.setuptools]
packages = ["rulemoor"]
